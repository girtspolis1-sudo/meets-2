name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci.invalid
      SUPABASE_PUBLISHABLE_KEY: ci-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  location-sql-tests:
    name: location-sql-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test automatic map point rules
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/stub-schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261111084937_location_auto_reference.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261111100352_location_auto_register_match_speed.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261111101048_location_auto_batched_check_and_snapshot.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261111110000_location_auto_apply.sql
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/location-auto.test.sql

  mobile-ux-smoke:
    name: mobile-ux-smoke
    if: github.event_name == 'pull_request'
    # Playwright 1.56.1 does not support ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci.invalid
      SUPABASE_PUBLISHABLE_KEY: ci-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build testable production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/meets-ux-app.log 2>&1 &
          echo $! > /tmp/meets-ux-app.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/meets-ux-app.log
          exit 1

      - name: Verify mobile interfaces
        run: node tests/ux-smoke.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meets-mobile-ux
          path: ux-screenshots/
          if-no-files-found: ignore
          retention-days: 14
